name: Comment pass

# Posts the engagement comment on videos that have JUST gone public, so today's
# upload gets its comment within hours instead of waiting ~2 days for the next
# Mon/Wed/Fri "Daily video" run (YouTube rejects comments on scheduled/private
# videos, so the 13:00 UTC pipeline can't comment on that day's 19:00/21:00 UTC
# upload). This is a LIGHT, isolated pass — no render, no upload — that only runs
# scripts/autoCommentPass.ts → autoCommentOnRecentVideos(), which is idempotent
# via a live commentThreads check, so it never double-comments a video the daily
# run already handled (the two triggers don't share state).
#
# Schedule: 22:00 UTC daily. That's after BOTH the 19:00 UTC long-form publish
# and the 21:00 UTC same-day teaser Short, and it also catches off-day Shorts
# that publish Tue/Thu/Sat/Sun (when there's no pipeline run at all).
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  comment-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run concurrently with itself; harmless even if it did (live dedupe),
    # but no reason to.
    concurrency:
      group: comment-pass
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      # The comment text is written by Claude Code headless (`claude -p`). Mirror
      # the daily workflow's CLI install + auth so comments are the sharp
      # binary/guess questions, not the deterministic fallback. If the CLI is
      # unavailable the pass still works — writeCommentText falls back cleanly.
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Pre-trust workspace for headless Claude Code
        run: |
          node -e '
            const fs = require("fs"), os = require("os"), path = require("path");
            const f = path.join(os.homedir(), ".claude.json");
            let c = {};
            try { c = JSON.parse(fs.readFileSync(f, "utf8")); } catch {}
            c.hasCompletedOnboarding = true;
            c.projects = c.projects || {};
            const cwd = process.env.GITHUB_WORKSPACE || process.cwd();
            c.projects[cwd] = { ...(c.projects[cwd] || {}), hasTrustDialogAccepted: true, allowedTools: [] };
            fs.writeFileSync(f, JSON.stringify(c));
            console.log("Pre-trusted workspace:", cwd);
          '

      - name: Run auto-comment pass
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          ENABLE_AUTO_COMMENT: '1'
        run: npx tsx scripts/autoCommentPass.ts
