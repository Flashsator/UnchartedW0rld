name: Shorts hook report

# Weekly READ-ONLY analytics pull: ranks every Short by views and shows its
# title/hook next to retention, engagement, and subscribers gained, so we can
# keep tuning the shortsHook prompt against what actually drives reach. It never
# edits a video — it only reads analytics and writes a summary to the run's job
# summary. Separate from daily.yml so it can never affect the publishing pipeline.
on:
  schedule:
    # Mondays 14:30 UTC, staggered 30m after the funnel report so the two
    # read-only pulls don't run at the same minute.
    - cron: '30 14 * * 1'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Shorts hook report
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: npx tsx scripts/shortsHookReport.ts
